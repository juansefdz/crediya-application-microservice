server:
  port: 8080

spring:
  application:
    name: CrediyaApplicationMicroservice

  r2dbc:
    url: r2dbc:pool:mysql://usuario:contrasena@localhost:3307/crediya_db?sslMode=DISABLED&serverZoneId=America/Bogota&allowPublicKeyRetrieval=true

  flyway:
    enabled: true
    url: jdbc:mysql://localhost:3307/crediya_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    user: usuario
    password: contrasena

  devtools:
    add-properties: false

  jackson:
    time-zone: America/Bogota

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: http://localhost:4200,http://localhost:8080