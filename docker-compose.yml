version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: crediya-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --lower_case_table_names=1
    environment:
      MYSQL_DATABASE: crediya_db
      MYSQL_USER: usuario
      MYSQL_PASSWORD: contrasena
      MYSQL_ROOT_PASSWORD: rootpass123
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - crediya_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
volumes:
  crediya_mysql_data:
